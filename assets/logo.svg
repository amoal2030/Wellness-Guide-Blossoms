<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentPetal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flower / Wellness Icon -->
  <g transform="translate(20, 10)">
    <!-- Outer decorative halo ring -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
    <circle cx="50" cy="50" r="42" fill="#ecfdf5" class="logo-bg-circle"/>

    <!-- Central Blooming Flower & Heart Shape -->
    <!-- Center petal -->
    <path d="M50 16 C42 32, 38 46, 50 64 C62 46, 58 32, 50 16 Z" fill="url(#primaryGrad)"/>
    <!-- Left petal -->
    <path d="M22 45 C36 40, 48 48, 50 64 C36 60, 26 55, 22 45 Z" fill="url(#accentPetal)" opacity="0.9"/>
    <!-- Right petal -->
    <path d="M78 45 C64 40, 52 48, 50 64 C64 60, 74 55, 78 45 Z" fill="url(#accentPetal)" opacity="0.9"/>
    <!-- Bottom left leaf -->
    <path d="M30 75 C34 60, 44 60, 50 64 C42 74, 35 78, 30 75 Z" fill="#047857"/>
    <!-- Bottom right leaf -->
    <path d="M70 75 C66 60, 56 60, 50 64 C58 74, 65 78, 70 75 Z" fill="#047857"/>
    <!-- Center Golden Dew Drop -->
    <circle cx="50" cy="62" r="5" fill="url(#goldGrad)" filter="url(#glow)"/>
    <path d="M47 84 C50 82, 53 82, 50 88 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Arabic and English Typography -->
  <g transform="translate(140, 25)">
    <!-- Guide Badge -->
    <rect x="0" y="2" width="94" height="20" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" class="logo-badge-bg"/>
    <text x="47" y="16" font-family="'Cairo', 'Tajawal', sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle" class="logo-badge-text">دليل المستخدم</text>

    <!-- Initiative Title -->
    <text x="0" y="48" font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#065f46" class="logo-title">
      عافية تُزهِـر
    </text>

    <!-- English Subtitle -->
    <text x="0" y="70" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#059669" letter-spacing="1" class="logo-subtitle">
      BLOOMING WELLNESS <tspan font-weight="400" fill="#d97706" class="logo-subbadge">• Official User Guide</tspan>
    </text>
  </g>
</svg>
